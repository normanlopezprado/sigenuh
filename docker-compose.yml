services:
  db:
    image: mariadb:10.11
    container_name: sigenuh-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${DB_PORT_LOCAL}:3306"  # acceso local
      - "0.0.0.0:${DB_PORT_PUBLIC}:3307"   # acceso remoto
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mariadb/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

# ========= APP (PHP-FPM + Composer + Node + Yarn) =========
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sigenuh-app
    depends_on:
      - db
    env_file:
      - .env.docker
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ========= WEB (Nginx) =========
  web:
    image: nginx:stable
    container_name: sigenuh-web
    depends_on:
      - app
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ========= Vite (hot-reload) =========
  vite:
    container_name: sigenuh-vite
    image: node:20-bullseye
    working_dir: /var/www/html
    command: sh -lc "corepack enable && yarn install --frozen-lockfile || yarn install && yarn dev --host ${VITE_HOST} --port ${VITE_PORT}"
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www/html
    ports:
      - "${VITE_PORT}:${VITE_PORT}"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data: