version: "3.9"

services:
  app:
    build: .
    container_name: sigenuh-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sigenuh
      DB_USERNAME: sigenuh
      DB_PASSWORD: sigenuh
    depends_on:
      - db
    networks:
      - laravel

  webserver:
    image: nginx:1.25-alpine
    container_name: sigenuh-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: sigenuh-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sigenuh
      MYSQL_USER: sigenuh
      MYSQL_PASSWORD: sigenuh
    ports:
      - "33060:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel

volumes:
  db-data:

networks:
  laravel:
    driver: bridge